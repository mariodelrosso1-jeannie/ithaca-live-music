<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ithaca Band Shows</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎸 Ithaca Band Shows</h1>
    <p class="subtitle">Upcoming live music around Ithaca, NY</p>
  </header>

  <main>
    <div class="controls">
      <input id="search" type="text" placeholder="Search band or venue..." list="venueSuggestions">
      <datalist id="venueSuggestions"></datalist>
      <select id="venueFilter">
        <option value="">All venues</option>
      </select>
      <button id="addVenueToggleBtn">+ Add Venue</button>
      <div class="view-toggle">
        <button id="listViewBtn" class="active">List</button>
        <button id="calendarViewBtn">Calendar</button>
      </div>
    </div>

    <div id="addVenueForm" class="controls add-venue-form hidden">
      <input id="newVenueName" type="text" placeholder="Venue name">
      <input id="newVenueAddress" type="text" placeholder="Address, town, or zip code">
      <button id="saveVenueBtn">Save Venue</button>
      <button id="cancelVenueBtn">Cancel</button>
      <span id="addVenueStatus" class="location-status"></span>
    </div>

    <div class="controls secondary-controls">
      <select id="daysFilter">
        <option value="all">All Dates</option>
        <option value="1">Next 1 day</option>
        <option value="2">Next 2 days</option>
        <option value="3">Next 3 days</option>
        <option value="4">Next 4 days</option>
        <option value="5">Next 5 days</option>
        <option value="6">Next 6 days</option>
        <option value="7">Next 7 days</option>
      </select>
      <select id="sortBy">
        <option value="date">Sort: Date</option>
        <option value="distance">Sort: Distance (nearest first)</option>
      </select>
      <input id="locationInput" type="text" placeholder="Zip code, town, or address">
      <button id="setLocationBtn">📍 Set Location</button>
      <span id="locationStatus" class="location-status"></span>
    </div>

    <section id="listView" class="view"></section>

    <section id="calendarView" class="view hidden">
      <div class="calendar-nav">
        <button id="prevMonth">&larr;</button>
        <h2 id="calendarMonthLabel"></h2>
        <button id="nextMonth">&rarr;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </section>
  </main>

  <footer>
    <p>Show data lives in <code>shows.json</code> — edit that file to add or update shows. Venues added
    with the "+ Add Venue" button are saved in this browser only (not shared with other devices).</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
